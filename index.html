.btn-primary {

.btn-restart {

.progress-bar {
  height: 6px;

  border-radius: 3px;
  margin-bottom: 24px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;

}

/* ---- Hidden ---- */

  to { opacity: 1; transform: translateY(0); }

.fade-in { animation: fadeIn 0.4s ease; }

@media (max-width: 480px) {

    text: '你最希望在恋爱中得到什么？',
    options: [
      { label: 'A', text: '被看见、被理解，不需要解释太多', scores: { prince:3, artsy:3, homey:1 } },
      { label: 'B', text: '数不清的甜蜜时刻和肢体接触', scores: { puppy:3, chaotic:1, homey:1 } },
      { label: 'C', text: '并肩作战的伙伴，一起搞事业一起变好', scores: { boss:3, queen:2, sassy:1 } },
      { label: 'D', text: '自由和空间，恋爱不等于失去自我', scores: { prince:2, sassy:2, chaotic:2 } }
    ]
  },
  {
    text: '吵架时你的风格是？',
    options: [
      { label: 'A', text: '据理力争，逻辑清晰地逐条反驳', scores: { boss:3, sassy:2, prince:1 } },
      { label: 'B', text: '先道歉再说，受不了冷战的气氛', scores: { puppy:3, homey:3, chaotic:1 } },
      { label: 'C', text: '冷战到底，等对方先开口', scores: { queen:3, prince:2, artsy:1 } },
      { label: 'D', text: '吵一半突然笑场，"我们为什么要吵这个啊"', scores: { chaotic:3, puppy:2, sassy:1 } }
    ]
  },
  {
    text: '回忆一下你手机相册里最多的是什么？',
    options: [
      { label: 'A', text: '自己的精修自拍和穿搭记录', scores: { queen:3, sassy:1, puppy:1 } },
      { label: 'B', text: '风景、天空、猫、咖啡和书的静物照', scores: { artsy:3, prince:2, homey:1 } },
      { label: 'C', text: '和朋友的合照、聚会截图、搞笑表情包', scores: { chaotic:3, puppy:3, sassy:1 } },
      { label: 'D', text: '备忘录截图、工作文件、待办事项', scores: { boss:3, homey:2, prince:1 } }
    ]
  }
];

// ==================== STATE ====================

let currentQuestion = 0;
let scores = {};
let selectedOption = null;

function resetScores() {
  scores = {};
  for (const key of Object.keys(TYPE_DATA)) {
    scores[key] = 0;
  }
}

// ==================== RENDER ====================

function startTest() {
  currentQuestion = 0;
  selectedOption = null;
  resetScores();
  document.getElementById('welcome').classList.add('hidden');
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('question-screen').classList.remove('hidden');
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQuestion];
  document.getElementById('question-num').textContent = `第 ${currentQuestion + 1} / ${QUESTIONS.length} 题`;
  document.getElementById('question-text').textContent = q.text;
  document.getElementById('progress-fill').style.width = `${((currentQuestion) / QUESTIONS.length) * 100}%`;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  selectedOption = null;

  q.options.forEach((opt, idx) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.setAttribute('tabindex', '0');
    div.setAttribute('role', 'radio');
    div.setAttribute('aria-checked', 'false');
    div.innerHTML = `<span class="letter">${opt.label}</span><span class="text">${opt.text}</span>`;
    div.addEventListener('click', () => selectOption(idx, div));
    div.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectOption(idx, div); } });
    optsDiv.appendChild(div);
  });

  document.getElementById('btn-next').disabled = true;
  document.getElementById('btn-next').textContent = currentQuestion === QUESTIONS.length - 1 ? '查看结果' : '下一题';

  // fade in
  const qs = document.getElementById('question-screen');
  qs.classList.remove('fade-in');
  void qs.offsetWidth;
  qs.classList.add('fade-in');
}

function selectOption(idx, el) {
  document.querySelectorAll('.option').forEach(o => { o.classList.remove('selected'); o.setAttribute('aria-checked', 'false'); });
  el.classList.add('selected');
  el.setAttribute('aria-checked', 'true');
  selectedOption = idx;
  document.getElementById('btn-next').disabled = false;
}

function nextQuestion() {
  if (selectedOption === null) return;

  // accumulate scores
  const opt = QUESTIONS[currentQuestion].options[selectedOption];
  for (const [type, pts] of Object.entries(opt.scores)) {
    scores[type] = (scores[type] || 0) + pts;
  }

  currentQuestion++;
  if (currentQuestion >= QUESTIONS.length) {
    showResult();
  } else {
    renderQuestion();
  }
}

function showResult() {
  document.getElementById('question-screen').classList.add('hidden');

  // find top type(s), randomly break ties
  let topScore = -1;
  const tied = [];
  for (const [type, pts] of Object.entries(scores)) {
    if (pts > topScore) { topScore = pts; tied.length = 0; tied.push(type); }
    else if (pts === topScore) { tied.push(type); }
  }
  const topType = tied[Math.floor(Math.random() * tied.length)];

  const data = TYPE_DATA[topType];
  const resultDiv = document.getElementById('result-screen');

  const pros = data.traits.pro.map(t => `<span class="trait trait-pro">${t}</span>`).join('');
  const cons = data.traits.con.map(t => `<span class="trait trait-con">${t}</span>`).join('');
  const matches = data.match.map(m => `<span class="match-tag">${m}</span>`).join('');

  resultDiv.innerHTML = `
    <div class="type-icon">${data.icon}</div>
    <div class="type-name">${data.name}</div>
    <div class="type-tagline">${data.tagline}</div>
    <div class="result-card">
      <h3>📖 性格解读</h3>
      <p>${data.desc}</p>
    </div>
    <div class="result-card">
      <h3>❤️ 恋爱画像</h3>
      <p>${data.love}</p>
    </div>
    <div class="result-card">
      <h3>✨ 优点</h3>
      <div class="traits">${pros}</div>
    </div>
    <div class="result-card">
      <h3>⚠️ 小缺点</h3>
      <div class="traits">${cons}</div>
    </div>
    <div class="result-card">
      <h3>💘 适配类型</h3>
      <div class="match-list">${matches}</div>
    </div>
    <button class="btn btn-restart" onclick="restart()">🔄 重新测试</button>
  `;

  resultDiv.classList.remove('hidden');

  // fade in
  resultDiv.classList.remove('fade-in');
  void resultDiv.offsetWidth;
  resultDiv.classList.add('fade-in');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  document.getElementById('result-screen').classList.add('hidden');
  document.getElementById('question-screen').classList.add('hidden');
  document.getElementById('welcome').classList.remove('hidden');
  // fade welcome back
  const w = document.getElementById('welcome');
  w.classList.remove('fade-in');
  void w.offsetWidth;
  w.classList.add('fade-in');
}
</script>
